<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>
  
  <!-- Graduation Cap Body -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diamond Cap Top -->
    <polygon points="32 14, 52 24, 32 34, 12 24" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Hanging Tassel -->
    <path d="M52 24v14"/>
    <circle cx="52" cy="39" r="1.5" fill="#ffffff"/>
    <!-- Lower Cap Arch -->
    <path d="M18 27.5v9c0 5 6 9 14 9s14-4 14-9v-9" fill="#ffffff" fill-opacity="0.25"/>
  </g>
  
  <!-- Mini Gold Sparkle in Top-Right -->
  <path d="M49 8l1.2 3.8L54 13l-3.8 1.2L49 18l-1.2-3.8L44 13l3.8-1.2z" fill="url(#sparkleGrad)"/>
</svg>
